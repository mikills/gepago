<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>gepago architecture</title>
<style>
  :root {
    --ink: #1f2937;
    --muted: #6b7280;
    --blue: #dbeafe;
    --green: #dcfce7;
    --yellow: #fef3c7;
    --purple: #ede9fe;
    --pink: #fce7f3;
    --orange: #ffedd5;
    --line: #374151;
  }
  html, body { margin: 0; background: #faf7ef; color: var(--ink); }
  body { font-family: "Virgil", "Comic Sans MS", "Segoe Print", system-ui, sans-serif; }
  .page { width: 1800px; height: 1260px; position: relative; overflow: hidden; }
  svg { width: 1800px; height: 1260px; display: block; }
  .title { font-size: 46px; font-weight: 700; fill: var(--ink); }
  .subtitle { font-size: 24px; fill: var(--muted); }
  .label { font-size: 24px; font-weight: 700; fill: var(--ink); }
  .small { font-size: 18px; fill: var(--ink); }
  .tiny { font-size: 15px; fill: var(--muted); }
  .box { stroke: var(--line); stroke-width: 3; rx: 18; ry: 18; filter: url(#roughShadow); }
  .inner { stroke: var(--line); stroke-width: 2; rx: 12; ry: 12; }
  .arrow { stroke: var(--line); stroke-width: 3; fill: none; marker-end: url(#arrow); }
  .thin { stroke-width: 1.5; }
  .dashed { stroke-dasharray: 10 9; }
  .note { fill: #fff7ed; stroke: #9a3412; stroke-width: 2; rx: 14; ry: 14; }
</style>
</head>
<body>
<div class="page">
<svg viewBox="0 0 1800 1260" role="img" aria-label="gepago v0.9.0 architecture diagram">
  <defs>
    <filter id="roughShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="4" dy="5" stdDeviation="0" flood-color="#111827" flood-opacity="0.16" />
    </filter>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto">
      <path d="M2,2 L14,8 L2,14 Z" fill="#374151" />
    </marker>
  </defs>

  <text x="50" y="72" class="title">gepago architecture</text>
  <text x="52" y="108" class="subtitle">v0.9.0: typed pipelines with transitions, run-time fan-out, scoped tools and a trace for every run, optimised by GEPA</text>

  <!-- caller -->
  <rect x="50" y="150" width="280" height="270" class="box" fill="#ffffff" />
  <text x="80" y="195" class="label">Your app</text>
  <text x="80" y="233" class="small">• inputs + RunContext</text>
  <text x="80" y="265" class="small">• examples + metric</text>
  <text x="80" y="297" class="small">• tools + middleware</text>
  <text x="80" y="329" class="small">• tool scope (tenant)</text>
  <text x="80" y="361" class="small">• observers</text>
  <text x="80" y="393" class="small">• Redactor</text>

  <!-- notes -->
  <rect x="50" y="440" width="280" height="140" class="note" />
  <text x="78" y="480" class="small">Every run is bounded.</text>
  <text x="78" y="510" class="tiny">budgets, timeouts and retries;</text>
  <text x="78" y="535" class="tiny">tool call limits per run and tool;</text>
  <text x="78" y="560" class="tiny">rewinds bounded by MaxVisits</text>

  <rect x="50" y="600" width="280" height="150" class="note" />
  <text x="78" y="640" class="small">Every run leaves a trace.</text>
  <text x="78" y="670" class="tiny">redacted events feed observers;</text>
  <text x="78" y="695" class="tiny">PipelineTrace feeds the run</text>
  <text x="78" y="720" class="tiny">report and reflection</text>

  <!-- core -->
  <rect x="370" y="140" width="860" height="650" class="box" fill="var(--blue)" />
  <text x="400" y="185" class="label">Core package: github.com/mikills/gepago</text>
  <text x="400" y="212" class="tiny">provider-neutral, agent-runtime-neutral</text>

  <!-- pipeline -->
  <rect x="395" y="235" width="500" height="365" class="inner" fill="#eff6ff" />
  <text x="420" y="268" class="small">Pipeline</text>
  <text x="500" y="268" class="tiny">Build checks keys, types, transitions, budgets</text>

  <rect x="415" y="285" width="185" height="65" class="inner" fill="#ffffff" />
  <text x="430" y="313" class="small">ProgramStep</text>
  <text x="430" y="337" class="tiny">Predict, TypedPredict</text>
  <rect x="625" y="285" width="115" height="65" class="inner" fill="#ffffff" />
  <text x="638" y="313" class="small">ToolStep</text>
  <text x="638" y="337" class="tiny">tool call</text>
  <rect x="765" y="285" width="110" height="65" class="inner" fill="#ffffff" />
  <text x="778" y="313" class="small">NewStep</text>
  <text x="778" y="337" class="tiny">plain Go</text>
  <path d="M601 318 L623 318" class="arrow thin" />
  <path d="M741 318 L763 318" class="arrow thin" />
  <text x="420" y="375" class="tiny">typed State (Key[T]) · Defaults · writes commit on success</text>

  <rect x="415" y="390" width="460" height="100" class="inner" fill="#ffffff" />
  <text x="430" y="418" class="small">Control flow</text>
  <text x="560" y="418" class="tiny">transitions between top-level steps</text>
  <text x="430" y="447" class="tiny">skip forward · End · Fail</text>
  <text x="430" y="472" class="tiny">Branch · Fallback · Parallel</text>
  <text x="655" y="447" class="tiny">rewind, bounded by MaxVisits</text>
  <text x="655" y="472" class="tiny">Amend · Accept</text>

  <rect x="415" y="502" width="220" height="88" class="inner" fill="#ffffff" />
  <text x="430" y="530" class="small">Map · MapCollect</text>
  <text x="430" y="555" class="tiny">one body run per element</text>
  <text x="430" y="578" class="tiny">shared budget and scope</text>

  <rect x="655" y="502" width="220" height="88" class="inner" fill="#ffffff" />
  <text x="670" y="530" class="small">Policies + budgets</text>
  <text x="670" y="555" class="tiny">WithPolicy: timeout, retry</text>
  <text x="670" y="578" class="tiny">WithCache · RunBudget</text>

  <!-- right column of core -->
  <rect x="915" y="235" width="290" height="90" class="inner" fill="#eff6ff" />
  <text x="940" y="265" class="small">Signature + Predict</text>
  <text x="940" y="290" class="tiny">typed fields → JSON schema</text>
  <text x="940" y="313" class="tiny">replies checked before return</text>

  <rect x="915" y="340" width="290" height="120" class="inner" fill="#eff6ff" />
  <text x="940" y="370" class="small">ToolRegistry</text>
  <text x="940" y="397" class="tiny">NewTool · Chat + ToolMiddleware</text>
  <text x="940" y="420" class="tiny">one session per run: policy, memory</text>
  <text x="940" y="443" class="tiny">WithToolScope · unbudgeted usage</text>

  <rect x="915" y="475" width="290" height="125" class="inner" fill="#eff6ff" />
  <text x="940" y="505" class="small">RunContext</text>
  <text x="940" y="532" class="tiny">RunID · ParentRunID · TraceID</text>
  <text x="940" y="555" class="tiny">nested runs share a trace</text>
  <text x="940" y="578" class="tiny">carried by events and traces</text>

  <!-- observers -->
  <rect x="395" y="612" width="500" height="165" class="inner" fill="#eff6ff" />
  <text x="420" y="642" class="small">Observers</text>
  <rect x="415" y="655" width="120" height="50" class="inner" fill="#ffffff" />
  <text x="430" y="685" class="tiny">step events</text>
  <rect x="560" y="655" width="110" height="50" class="inner" fill="#ffffff" />
  <text x="578" y="685" class="tiny">Redactor</text>
  <rect x="695" y="655" width="180" height="50" class="inner" fill="#ffffff" />
  <text x="712" y="685" class="tiny">RecordingObserver</text>
  <path d="M536 680 L558 680" class="arrow thin" />
  <path d="M671 680 L693 680" class="arrow thin" />
  <text x="420" y="735" class="tiny">→ PipelineTrace → HTML run report, TraceDatasetBuilder</text>
  <text x="420" y="760" class="tiny">visits, transitions, unbudgeted usage; values redacted</text>

  <rect x="915" y="612" width="290" height="165" class="inner" fill="#eff6ff" />
  <text x="940" y="642" class="small">Compile + Optimizer</text>
  <text x="940" y="670" class="tiny">ProgramEvaluator · metrics</text>
  <text x="940" y="693" class="tiny">exact / contains / numeric / judge</text>
  <text x="940" y="716" class="tiny">reflection on step failures</text>
  <text x="940" y="739" class="tiny">Pareto frontier weighted</text>
  <text x="940" y="762" class="tiny">by per-instance wins</text>

  <!-- providers -->
  <rect x="1270" y="140" width="480" height="300" class="box" fill="var(--purple)" />
  <text x="1300" y="185" class="label">providers/*</text>
  <text x="1300" y="212" class="tiny">Generator · StructuredGenerator · ChatClient</text>
  <rect x="1300" y="232" width="200" height="75" class="inner" fill="#f5f3ff" />
  <text x="1325" y="265" class="small">openai</text>
  <text x="1325" y="290" class="tiny">OpenAI-compatible</text>
  <rect x="1520" y="232" width="200" height="75" class="inner" fill="#f5f3ff" />
  <text x="1545" y="265" class="small">claude</text>
  <text x="1545" y="290" class="tiny">Anthropic SDK</text>
  <rect x="1300" y="322" width="200" height="75" class="inner" fill="#f5f3ff" />
  <text x="1325" y="355" class="small">google</text>
  <text x="1325" y="380" class="tiny">Gemini</text>
  <rect x="1520" y="322" width="200" height="75" class="inner" fill="#f5f3ff" />
  <text x="1545" y="355" class="small">pi</text>
  <text x="1545" y="380" class="tiny">pi CLI</text>
  <text x="1300" y="425" class="tiny">Config.Logger logs each call with its RunContext</text>

  <rect x="1270" y="455" width="480" height="95" class="note" />
  <text x="1300" y="483" class="tiny">Generate(ctx, prompt) → Generation:</text>
  <text x="1300" y="507" class="tiny">text · usage · model · finish reason</text>
  <text x="1300" y="531" class="tiny">errors are permanent, transient or budget</text>

  <!-- agents -->
  <rect x="1270" y="575" width="480" height="215" class="box" fill="var(--green)" />
  <text x="1300" y="618" class="label">agents package</text>
  <text x="1300" y="645" class="tiny">optional runtime for tool-calling workflows</text>
  <rect x="1300" y="662" width="200" height="70" class="inner" fill="#f0fdf4" />
  <text x="1325" y="693" class="small">Agent loop</text>
  <text x="1325" y="717" class="tiny">chat + shared tools</text>
  <rect x="1520" y="662" width="200" height="70" class="inner" fill="#f0fdf4" />
  <text x="1545" y="693" class="small">TraceRecorder</text>
  <text x="1545" y="717" class="tiny">events + spans</text>
  <rect x="1395" y="745" width="230" height="35" class="inner" fill="#f0fdf4" />
  <text x="1420" y="768" class="tiny">TraceDatasetBuilder</text>

  <!-- workflow -->
  <rect x="50" y="840" width="1060" height="370" class="box" fill="var(--yellow)" />
  <text x="90" y="890" class="label">Optimisation loop</text>

  <rect x="105" y="950" width="145" height="80" class="inner" fill="#fffbeb" />
  <text x="135" y="985" class="small">Seed</text>
  <text x="125" y="1013" class="tiny">initial prompts</text>

  <rect x="305" y="950" width="155" height="80" class="inner" fill="#fffbeb" />
  <text x="335" y="985" class="small">Evaluate</text>
  <text x="329" y="1013" class="tiny">score + traces</text>

  <rect x="520" y="950" width="165" height="80" class="inner" fill="#fffbeb" />
  <text x="550" y="985" class="small">Reflect</text>
  <text x="537" y="1013" class="tiny">LLM proposes patch</text>

  <rect x="745" y="950" width="165" height="80" class="inner" fill="#fffbeb" />
  <text x="775" y="985" class="small">Accept?</text>
  <text x="768" y="1013" class="tiny">minibatch improves</text>

  <rect x="520" y="1095" width="220" height="80" class="inner" fill="#fffbeb" />
  <text x="550" y="1130" class="small">Validate</text>
  <text x="547" y="1158" class="tiny">update Pareto frontier</text>

  <path d="M250 990 C270 990, 285 990, 305 990" class="arrow" />
  <path d="M460 990 C485 990, 500 990, 520 990" class="arrow" />
  <path d="M685 990 C710 990, 725 990, 745 990" class="arrow" />
  <path d="M830 1030 C820 1080, 780 1125, 740 1135" class="arrow" />
  <path d="M520 1135 C320 1130, 160 1070, 175 1032" class="arrow dashed" />
  <text x="150" y="1180" class="tiny">repeat until metric-call budget is spent</text>

  <!-- outputs -->
  <rect x="1170" y="860" width="580" height="330" class="box" fill="var(--pink)" />
  <text x="1205" y="910" class="label">Outputs</text>
  <text x="1205" y="952" class="small">• compiled programme + fingerprinted artefact</text>
  <text x="1205" y="986" class="small">• loaders refuse a mismatched fingerprint</text>
  <text x="1205" y="1020" class="small">• optimisation state + persistence</text>
  <text x="1205" y="1054" class="small">• PipelineTrace for every run</text>
  <text x="1205" y="1088" class="small">• HTML reports for optimisation and runs</text>
  <text x="1205" y="1135" class="tiny">compiled.Artifact(name) → SaveProgramArtifact</text>
  <text x="1205" y="1160" class="tiny">→ LoadCompiledProgram checks Pipeline.Fingerprint()</text>

  <!-- arrows between areas -->
  <path d="M330 265 C345 262, 355 262, 369 262" class="arrow" />
  <path d="M1230 280 C1245 278, 1255 278, 1269 278" class="arrow" />
  <path d="M1510 550 C1510 558, 1510 565, 1510 574" class="arrow dashed" />
  <path d="M1230 700 C1245 698, 1255 698, 1269 698" class="arrow dashed" />
  <path d="M800 790 C790 812, 770 828, 742 839" class="arrow" />
  <path d="M1110 1025 C1130 1025, 1150 1025, 1169 1025" class="arrow" />
</svg>
</div>
</body>
</html>
