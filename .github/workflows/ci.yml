name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Format
        run: make fmt

      - name: Check formatting
        run: git diff --exit-code

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.x"
          cache: npm
          cache-dependency-path: packages/gepago/wasm/package-lock.json

      - name: Install WASM package dependencies
        working-directory: packages/gepago/wasm
        run: npm ci

      - name: Test
        run: make test

      - name: WASM package test
        run: make wasm-test

      - name: Vet
        run: make vet

      - name: Staticcheck
        run: make staticcheck
