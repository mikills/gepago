name: release-classify

on:
  push:
    tags:
      - "programs/classify/v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Test standalone module
        working-directory: programs/classify
        env:
          GOWORK: "off"
        run: go test ./... -count=1

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME##*/}"
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --generate-notes \
            --latest=false \
            --title "Classify ${version}"
