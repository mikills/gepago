name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.x"
          cache: npm
          cache-dependency-path: packages/gepago/wasm/package-lock.json

      - name: Install WASM package dependencies
        working-directory: packages/gepago/wasm
        run: npm ci

      - name: Test
        run: make test

      - name: WASM package test
        run: make wasm-test

      - name: Package source artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          version="${GITHUB_REF_NAME}"
          archive="gepago_${version}_source.tar.gz"
          git archive --format=tar.gz --prefix="gepago-${version}/" -o "dist/${archive}" "${GITHUB_SHA}"
          (cd dist && sha256sum * > checksums.txt)

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
